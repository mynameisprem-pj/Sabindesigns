<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sabin Designs — Admin</title>
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:        #0f0f0f;
  --surface:   #1a1a1a;
  --surface2:  #222222;
  --border:    #2e2e2e;
  --yellow:    #f5c800;
  --yellow-dim:#a88900;
  --text:      #e8e8e8;
  --muted:     #888;
  --danger:    #e05555;
  --success:   #4caf7d;
  --radius:    10px;
  --sidebar-w: 230px;
}
html { font-size: 15px; }
body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

/* ── Login Screen ── */
#loginScreen {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
}
.login-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; text-align: center;
}
.login-box h1 { font-size: 1.4rem; margin-bottom: .3rem; }
.login-box p  { color: var(--muted); font-size: .85rem; margin-bottom: 1.8rem; }
.login-field  { position: relative; margin-bottom: 1rem; }
.login-field input {
  width: 100%; padding: .75rem 2.8rem .75rem 1rem;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 1rem; outline: none;
}
.login-field input:focus { border-color: var(--yellow); }
.toggle-pw {
  position: absolute; right: .8rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; color: var(--muted); cursor: pointer; font-size: .85rem; padding: 0;
}
.btn-login {
  width: 100%; padding: .75rem; background: var(--yellow); color: #000;
  border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;
  transition: opacity .15s;
}
.btn-login:hover { opacity: .85; }
.login-err { color: var(--danger); font-size: .82rem; margin-top: .75rem; min-height: 1.2em; }

/* ── App Shell ── */
#appShell { display: none; }
#appShell.visible { display: flex; }

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 100vh; position: fixed; top: 0; left: 0; z-index: 100;
  transition: transform .25s;
}
.sidebar-logo { padding: 1.2rem 1.2rem .8rem; border-bottom: 1px solid var(--border); }
.sidebar-logo span { font-weight: 800; font-size: 1rem; color: var(--yellow); display: block; }
.sidebar-logo small { color: var(--muted); font-size: .72rem; }
.sidebar-nav { flex: 1; padding: .8rem 0; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .65rem 1.2rem; color: var(--muted); font-size: .88rem;
  cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  border-left: 3px solid transparent; transition: all .15s;
}
.nav-item:hover   { color: var(--text); background: var(--surface2); }
.nav-item.active  { color: var(--yellow); border-left-color: var(--yellow); background: var(--surface2); }
.nav-item .icon   { width: 18px; text-align: center; font-style: normal; }
.sidebar-foot {
  padding: 1rem 1.2rem; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: .5rem;
}
.btn-sm {
  padding: .45rem .9rem; border-radius: 6px; font-size: .8rem;
  cursor: pointer; font-weight: 600; border: 1px solid var(--border);
  background: var(--surface2); color: var(--text); transition: all .15s;
}
.btn-sm:hover { background: var(--border); }
.btn-sm.danger { border-color: var(--danger); color: var(--danger); }
.btn-sm.danger:hover { background: var(--danger); color: #fff; }

/* ── Main Content ── */
.main-wrap { margin-left: var(--sidebar-w); flex: 1; }
.topbar {
  padding: .9rem 1.5rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 1rem;
  background: var(--surface); position: sticky; top: 0; z-index: 50;
}
.topbar h2 { font-size: 1rem; font-weight: 700; flex: 1; }
.btn-save {
  padding: .5rem 1.2rem; background: var(--yellow); color: #000;
  border: none; border-radius: 8px; font-weight: 700; font-size: .88rem;
  cursor: pointer; transition: opacity .15s; display: flex; align-items: center; gap: .4rem;
}
.btn-save:hover   { opacity: .85; }
.btn-save:disabled { opacity: .4; cursor: default; }
.save-status { font-size: .8rem; color: var(--muted); }

.content-area { padding: 1.5rem; max-width: 820px; }

/* ── Section ── */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 1.2rem; }
.panel-head {
  padding: .9rem 1.2rem; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: .5rem;
}
.panel-head h3 { font-size: .9rem; font-weight: 700; }
.panel-body { padding: 1.2rem; }

/* ── Form controls ── */
.field { margin-bottom: 1rem; }
.field:last-child { margin-bottom: 0; }
.field label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: .35rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.field input, .field textarea, .field select {
  width: 100%; padding: .65rem .85rem;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: .9rem;
  outline: none; font-family: inherit; transition: border-color .15s;
}
.field input:focus, .field textarea:focus { border-color: var(--yellow); }
.field textarea { resize: vertical; min-height: 90px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.field-row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }

/* ── Image grid ── */
.img-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: .6rem; margin-bottom: 1rem;
}
.img-item {
  position: relative; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--border); background: var(--bg); aspect-ratio: 16/9;
}
.img-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-item .remove-btn {
  position: absolute; top: 4px; right: 4px;
  background: rgba(0,0,0,.75); border: none; color: #fff;
  border-radius: 50%; width: 22px; height: 22px;
  cursor: pointer; font-size: .7rem; line-height: 22px; text-align: center; opacity: 0;
  transition: opacity .15s;
}
.img-item:hover .remove-btn { opacity: 1; }
.img-item .img-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,.6); font-size: .65rem; color: #ccc;
  padding: 2px 5px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;
}

/* Clients grid uses square */
.clients-grid .img-item { aspect-ratio: 1; }

/* ── Add upload row ── */
.upload-row { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: .5rem; }
.btn-upload {
  padding: .5rem 1rem; border-radius: 8px; background: var(--surface2);
  border: 1px dashed var(--border); color: var(--muted); cursor: pointer;
  font-size: .85rem; transition: all .15s; display: flex; align-items: center; gap: .4rem;
}
.btn-upload:hover { border-color: var(--yellow); color: var(--yellow); }
.upload-hint { font-size: .75rem; color: var(--muted); }

/* ── Testimonials ── */
.testi-list { display: flex; flex-direction: column; gap: .75rem; }
.testi-item {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 1rem;
}
.testi-item-head { display: flex; align-items: center; gap: .6rem; margin-bottom: .75rem; }
.testi-item-head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border); }
.testi-item-head span { flex: 1; font-size: .82rem; color: var(--muted); }
.testi-item-head button { background: none; border: none; color: var(--danger); cursor: pointer; font-size: .8rem; padding: .2rem .4rem; border-radius: 4px; }
.testi-item-head button:hover { background: rgba(224,85,85,.12); }
.stars-row { display: flex; gap: .3rem; font-size: 1.1rem; color: #888; margin-top: .5rem; }
.stars-row .star { cursor: pointer; transition: color .1s; }
.stars-row .star.on { color: var(--yellow); }

/* ── Social links ── */
.social-list { display: flex; flex-direction: column; gap: .6rem; }
.social-item { display: flex; gap: .6rem; align-items: center; }
.social-item select { width: 130px; flex-shrink: 0; }
.social-item input { flex: 1; }
.social-item button { background: none; border: 1px solid var(--border); color: var(--danger); cursor: pointer; border-radius: 6px; padding: .4rem .6rem; font-size: .8rem; }
.social-item button:hover { background: rgba(224,85,85,.12); }

/* ── Stats ── */
.stats-list { display: flex; flex-direction: column; gap: .6rem; }
.stat-item { display: flex; gap: .6rem; align-items: center; }
.stat-item input:first-of-type { width: 80px; flex-shrink: 0; }
.stat-item input:last-child { flex: 1; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 1.5rem; right: 1.5rem;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: .8rem 1.2rem; font-size: .88rem; z-index: 999;
  display: flex; align-items: center; gap: .6rem;
  box-shadow: 0 4px 24px rgba(0,0,0,.5);
  transform: translateY(120%); transition: transform .3s; pointer-events: none;
}
.toast.show { transform: translateY(0); }
.toast.ok   { border-color: var(--success); }
.toast.err  { border-color: var(--danger); }

/* ── Change Password modal ── */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.modal-bg.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 2rem; width: 100%; max-width: 360px;
}
.modal-box h3 { margin-bottom: 1.2rem; font-size: 1rem; }
.modal-box .field { margin-bottom: .9rem; }

/* ── Mobile hamburger ── */
.ham-btn {
  display: none; background: none; border: none; color: var(--text);
  cursor: pointer; font-size: 1.3rem; line-height: 1; padding: .2rem;
}
.sidebar-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 99;
}

@media (max-width: 700px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-overlay.open { display: block; }
  .main-wrap { margin-left: 0; }
  .ham-btn { display: block; }
  .field-row, .field-row3 { grid-template-columns: 1fr; }
  .img-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen">
  <div class="login-box">
    <h1>⚡ Sabin Designs</h1>
    <p>Admin Panel — enter your password</p>
    <div class="login-field">
      <input type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
      <button class="toggle-pw" id="togglePw" type="button">Show</button>
    </div>
    <button class="btn-login" id="loginBtn">Sign in</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- ── APP ── -->
<div id="appShell">
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span>Sabin Designs</span>
      <small>Admin Panel</small>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-item" data-panel="logo">      <i class="icon">🎨</i> Site Logo</button>
      <button class="nav-item active" data-panel="hero">   <i class="icon">🏠</i> Hero</button>
      <button class="nav-item" data-panel="clients">       <i class="icon">👥</i> Client Logos</button>
      <button class="nav-item" data-panel="work">          <i class="icon">🖼️</i> My Work</button>
      <button class="nav-item" data-panel="about">         <i class="icon">👤</i> About</button>
      <button class="nav-item" data-panel="testimonials">  <i class="icon">💬</i> Testimonials</button>
      <button class="nav-item" data-panel="contact">       <i class="icon">📞</i> Contact</button>
    </nav>
    <div class="sidebar-foot">
      <button class="btn-sm" id="changePwBtn">🔑 Change Password</button>
      <button class="btn-sm danger" id="logoutBtn">Logout</button>
    </div>
  </aside>

  <div class="main-wrap">
    <div class="topbar">
      <button class="ham-btn" id="hamBtn">☰</button>
      <h2 id="panelTitle">Hero</h2>
      <span class="save-status" id="saveStatus"></span>
      <button class="btn-save" id="saveBtn">💾 Save Changes</button>
    </div>

    <div class="content-area" id="contentArea">
      <!-- injected by JS -->
    </div>
  </div>
</div>

<!-- ── Change Password Modal ── -->
<div class="modal-bg" id="changePwModal">
  <div class="modal-box">
    <h3>🔑 Change Password</h3>
    <div class="field"><label>Current Password</label>
      <input type="password" id="cpCurrent" placeholder="Current password">
    </div>
    <div class="field"><label>New Password</label>
      <input type="password" id="cpNew" placeholder="New password (min 6 chars)">
    </div>
    <div class="field"><label>Confirm New Password</label>
      <input type="password" id="cpConfirm" placeholder="Confirm new password">
    </div>
    <p class="login-err" id="cpErr"></p>
    <div style="display:flex;gap:.6rem;margin-top:1rem">
      <button class="btn-sm" id="cpCancel" style="flex:1">Cancel</button>
      <button class="btn-save" id="cpSave" style="flex:1;justify-content:center">Update</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   CONFIGURATION — edit these before deploying
   ============================================================ */
const CONFIG = {
  // Your GitHub repo  e.g. "sabindesigns/portfolio"
  GITHUB_REPO:   'mynameisprem-pj/Sabindesigns',
  // Branch to commit to
  GITHUB_BRANCH: 'main',
  // Cloudinary cloud name
  CLD_CLOUD:     'dqp8gyxri',
  // Cloudinary unsigned upload preset
  CLD_PRESET:    'sabin_unsigned',
  // Path to data file inside repo
  DATA_PATH:     'content/data.json',
  // localStorage keys
  TOKEN_KEY:     'sabin_admin_token',
  PASS_HASH_KEY: 'sabin_admin_pw',
  // Default password hash (SHA-256 of "admin123") — change on first login!
  DEFAULT_HASH:  '240be518fabd2724ddb6f04eeb1da5967448d7e831c08c8fa822809f74c720a'
};

/* ============================================================
   AUTH — Web Crypto SHA-256 + localStorage session
   ============================================================ */
async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

function savedHash() {
  return localStorage.getItem(CONFIG.PASS_HASH_KEY) || CONFIG.DEFAULT_HASH;
}

function isLoggedIn() {
  return localStorage.getItem(CONFIG.TOKEN_KEY) === 'yes';
}

function doLogout() {
  localStorage.removeItem(CONFIG.TOKEN_KEY);
  location.reload();
}

/* ── Show/hide login vs app ── */
function showApp()   { document.getElementById('loginScreen').style.display='none'; document.getElementById('appShell').classList.add('visible'); }
function showLogin() { document.getElementById('loginScreen').style.display='flex'; document.getElementById('appShell').classList.remove('visible'); }

/* ── Toggle password visibility ── */
const pwInput  = document.getElementById('pwInput');
const togglePw = document.getElementById('togglePw');
togglePw.addEventListener('click', () => {
  const isText = pwInput.type === 'text';
  pwInput.type = isText ? 'password' : 'text';
  togglePw.textContent = isText ? 'Show' : 'Hide';
});

/* ── Login handler ── */
document.getElementById('loginBtn').addEventListener('click', async () => {
  const val = pwInput.value.trim();
  if (!val) return;
  const h = await sha256(val);
  if (h === savedHash()) {
    localStorage.setItem(CONFIG.TOKEN_KEY, 'yes');
    showApp();
    await initApp();
  } else {
    document.getElementById('loginErr').textContent = 'Incorrect password.';
    pwInput.value = '';
  }
});
pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('loginBtn').click(); });

document.getElementById('logoutBtn').addEventListener('click', doLogout);

/* ============================================================
   TOAST
   ============================================================ */
function toast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = (type === 'ok' ? '✅ ' : '❌ ') + msg;
  t.className = `toast ${type} show`;
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 3500);
}

/* ============================================================
   GITHUB API helpers
   ============================================================ */
async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB_REPO}/contents/${path}`, {
    headers: { Authorization: `token ${getGhToken()}`, Accept: 'application/vnd.github.v3+json' }
  });
  if (!res.ok) throw new Error(`GitHub GET failed: ${res.status}`);
  return res.json();
}

async function ghPut(path, content, sha, message) {
  const body = { message, content: btoa(unescape(encodeURIComponent(JSON.stringify(content, null, 2)))), branch: CONFIG.GITHUB_BRANCH };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${CONFIG.GITHUB_REPO}/contents/${path}`, {
    method: 'PUT',
    headers: { Authorization: `token ${getGhToken()}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || 'GitHub PUT failed'); }
  return res.json();
}

function getGhToken() {
  const t = sessionStorage.getItem('sabin_gh_token');
  if (!t) {
    const entered = prompt('Enter your GitHub Personal Access Token (stored in session only):');
    if (entered) sessionStorage.setItem('sabin_gh_token', entered.trim());
    return entered ? entered.trim() : '';
  }
  return t;
}

/* ============================================================
   CLOUDINARY upload
   ============================================================ */
async function uploadToCloudinary(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', CONFIG.CLD_PRESET);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.CLD_CLOUD}/image/upload`, { method: 'POST', body: fd });
  if (!res.ok) throw new Error('Cloudinary upload failed');
  const d = await res.json();
  return d.secure_url;
}

/* ============================================================
   STATE
   ============================================================ */
let data = null;        // loaded from GitHub
let dataSha = null;     // SHA of data.json in repo (needed for PUT)
let currentPanel = 'hero';

/* ============================================================
   LOAD DATA from GitHub
   ============================================================ */
async function loadData() {
  try {
    const file = await ghGet(CONFIG.DATA_PATH);
    dataSha = file.sha;
    const decoded = decodeURIComponent(escape(atob(file.content.replace(/\n/g, ''))));
    data = JSON.parse(decoded);
  } catch (e) {
    toast('Could not load data.json from GitHub. Check your repo config and token.', 'err');
    throw e;
  }
}

/* ============================================================
   SAVE DATA to GitHub
   ============================================================ */
async function saveData() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  document.getElementById('saveStatus').textContent = 'Saving…';
  try {
    // Collect form → update data object
    collectCurrentPanel();
    const result = await ghPut(CONFIG.DATA_PATH, data, dataSha, 'admin: update content via panel');
    dataSha = result.content.sha; // update sha for next save
    document.getElementById('saveStatus').textContent = 'Saved ✓';
    toast('Saved! Vercel will redeploy in ~30 seconds.');
    setTimeout(() => document.getElementById('saveStatus').textContent = '', 4000);
  } catch (e) {
    toast(e.message, 'err');
    document.getElementById('saveStatus').textContent = 'Error';
  }
  btn.disabled = false;
}

document.getElementById('saveBtn').addEventListener('click', saveData);

/* ============================================================
   COLLECT current panel form values → write to data object
   ============================================================ */
function collectCurrentPanel() {
  const ca = document.getElementById('contentArea');
  const val = id => (ca.querySelector(`#${id}`) || {}).value || '';

  if (currentPanel === 'logo') {
    if (!data.site) data.site = {};
    data.site.logo_alt = val('logoAlt');
    // logo URL is updated in-place on upload, no need to read from input
  }

  if (currentPanel === 'hero') {
    data.hero.headline           = val('heroHeadline');
    data.hero.subtext            = val('heroSub');
    data.hero.cta_primary_label  = val('heroCta1Label');
    data.hero.cta_primary_href   = val('heroCta1Href');
    data.hero.cta_secondary_label= val('heroCta2Label');
    data.hero.cta_secondary_href = val('heroCta2Href');
    data.hero.clients_label      = val('heroClientsLabel');
  }

  if (currentPanel === 'about') {
    data.about.bio = val('aboutBio');
    data.about.stats = [...ca.querySelectorAll('.stat-item')].map(row => ({
      num:   row.querySelector('.stat-num-inp').value,
      label: row.querySelector('.stat-lbl-inp').value
    }));
  }

  if (currentPanel === 'contact') {
    data.contact.eyebrow        = val('ctEyebrow');
    data.contact.headline       = val('ctHeadline');
    data.contact.subtext        = val('ctSubtext');
    data.contact.whatsapp_number= val('ctWa');
    data.contact.whatsapp_prefill= val('ctWaPrefill');
    data.contact.socials = [...ca.querySelectorAll('.social-item')].map(row => ({
      platform: row.querySelector('.soc-platform').value,
      label:    row.querySelector('.soc-label').value,
      url:      row.querySelector('.soc-url').value
    }));
  }

  if (currentPanel === 'testimonials') {
    data.testimonials = [...ca.querySelectorAll('.testi-item')].map(card => ({
      logo:  card.dataset.logo,
      alt:   card.querySelector('.testi-alt').value,
      quote: card.querySelector('.testi-quote-inp').value,
      stars: parseInt(card.querySelector('.stars-row').dataset.stars) || 5
    }));
  }

  // clients + work + about portrait are updated in-place when images are changed
}

/* ============================================================
   PANELS
   ============================================================ */
const PANELS = {
  logo() {
    const s = data.site || {};
    return `
    <div class="panel"><div class="panel-head"><h3>🎨 Site Logo</h3></div>
    <div class="panel-body">
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:1rem">This logo appears in the nav bar, the splash screen on load, and the footer. Recommended: square PNG with transparent background.</p>
      <div class="field">
        <label>Current Logo</label>
        <div style="display:flex;align-items:center;gap:1.2rem;margin-bottom:.5rem">
          <img id="logoPreview" src="${s.logo || 'images/logo.png'}" style="width:80px;height:80px;object-fit:contain;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px">
          <div>
            <label class="btn-upload">📷 Upload New Logo<input type="file" accept="image/*" style="display:none" id="logoUpload"></label>
            <p style="font-size:.75rem;color:var(--muted);margin-top:.4rem">Uploaded to Cloudinary · auto-updates nav, splash &amp; footer</p>
          </div>
        </div>
      </div>
      <div class="field"><label>Alt Text (screen readers)</label><input id="logoAlt" value="${esc(s.logo_alt || 'Sabin Designs')}"></div>
    </div></div>`;
  },
  hero() {
    const h = data.hero;
    return `
    <div class="panel"><div class="panel-head"><h3>🏠 Hero Section</h3></div>
    <div class="panel-body">
      <div class="field"><label>Headline</label><input id="heroHeadline" value="${esc(h.headline)}"></div>
      <div class="field"><label>Sub-text</label><textarea id="heroSub">${esc(h.subtext)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>Primary button label</label><input id="heroCta1Label" value="${esc(h.cta_primary_label)}"></div>
        <div class="field"><label>Primary button link</label><input id="heroCta1Href" value="${esc(h.cta_primary_href)}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Secondary button label</label><input id="heroCta2Label" value="${esc(h.cta_secondary_label)}"></div>
        <div class="field"><label>Secondary button link</label><input id="heroCta2Href" value="${esc(h.cta_secondary_href)}"></div>
      </div>
      <div class="field"><label>Clients strip label</label><input id="heroClientsLabel" value="${esc(h.clients_label)}"></div>
    </div></div>`;
  },

  clients() {
    const items = data.clients;
    return `
    <div class="panel"><div class="panel-head"><h3>👥 Client Logos</h3></div>
    <div class="panel-body">
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:.9rem">These logos scroll in the hero strip and also appear in testimonials. Recommended: square PNG with transparent background.</p>
      <div class="img-grid clients-grid" id="clientsGrid">
        ${items.map((c,i) => clientCard(c,i)).join('')}
      </div>
      <div class="upload-row">
        <label class="btn-upload">
          ➕ Add Logo
          <input type="file" accept="image/*" style="display:none" id="clientUpload" multiple>
        </label>
        <span class="upload-hint">Uploaded to Cloudinary · instant</span>
      </div>
    </div></div>`;
  },

  work() {
    const thumbs = data.thumbnails;
    return `
    <div class="panel"><div class="panel-head"><h3>🖼️ Work Thumbnails</h3></div>
    <div class="panel-body">
      <p style="font-size:.82rem;color:var(--muted);margin-bottom:.9rem">These are used in both the "My Work" reel and the hero background marquee. Add or remove freely — the site auto-distributes them into rows.</p>
      <div class="img-grid" id="workGrid">
        ${thumbs.map((t,i) => thumbCard(t,i)).join('')}
      </div>
      <div class="upload-row">
        <label class="btn-upload">
          ➕ Add Thumbnail
          <input type="file" accept="image/*" style="display:none" id="workUpload" multiple>
        </label>
        <span class="upload-hint">Uploaded to Cloudinary · auto-syncs to hero</span>
      </div>
    </div></div>`;
  },

  about() {
    const ab = data.about;
    return `
    <div class="panel"><div class="panel-head"><h3>👤 About Section</h3></div>
    <div class="panel-body">
      <div class="field">
        <label>Portrait Image</label>
        <div style="display:flex;align-items:center;gap:1rem;margin-bottom:.5rem">
          <img id="portraitPreview" src="${esc(ab.portrait)}" style="width:72px;height:72px;border-radius:50%;object-fit:cover;border:1px solid var(--border)">
          <label class="btn-upload">📷 Change Photo<input type="file" accept="image/*" style="display:none" id="portraitUpload"></label>
        </div>
      </div>
      <div class="field"><label>Bio</label><textarea id="aboutBio" rows="5">${esc(ab.bio)}</textarea></div>
      <div class="field"><label>Stats</label>
        <div class="stats-list" id="statsList">
          ${(ab.stats||[]).map(s => `
            <div class="stat-item">
              <input class="stat-num-inp" placeholder="e.g. 100+" value="${esc(s.num)}">
              <input class="stat-lbl-inp" placeholder="Label" value="${esc(s.label)}">
            </div>`).join('')}
        </div>
      </div>
    </div></div>`;
  },

  testimonials() {
    return `
    <div class="panel"><div class="panel-head"><h3>💬 Testimonials</h3></div>
    <div class="panel-body">
      <div class="testi-list" id="testiList">
        ${data.testimonials.map((t,i) => testiCard(t,i)).join('')}
      </div>
      <div style="margin-top:1rem">
        <button class="btn-upload" id="addTestiBtn">➕ Add Testimonial</button>
      </div>
    </div></div>`;
  },

  contact() {
    const ct = data.contact;
    return `
    <div class="panel"><div class="panel-head"><h3>📞 Contact Section</h3></div>
    <div class="panel-body">
      <div class="field"><label>Eyebrow text</label><input id="ctEyebrow" value="${esc(ct.eyebrow)}"></div>
      <div class="field"><label>Headline</label><input id="ctHeadline" value="${esc(ct.headline)}"></div>
      <div class="field"><label>Sub-text</label><textarea id="ctSubtext">${esc(ct.subtext)}</textarea></div>
      <div class="field-row">
        <div class="field"><label>WhatsApp Number <small style="color:var(--muted)">(include country code, no +)</small></label><input id="ctWa" value="${esc(ct.whatsapp_number)}"></div>
      </div>
      <div class="field"><label>WhatsApp pre-fill message</label><textarea id="ctWaPrefill">${esc(ct.whatsapp_prefill)}</textarea></div>
      <div class="field"><label>Social Links</label>
        <div class="social-list" id="socialList">
          ${(ct.socials||[]).map(s => socialRow(s)).join('')}
        </div>
        <button class="btn-upload" id="addSocialBtn" style="margin-top:.6rem">➕ Add Social Link</button>
      </div>
    </div></div>`;
  }
};

/* ── helpers for repeated HTML ── */
function esc(s) { return String(s||'').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function thumbCard(t,i) {
  return `<div class="img-item" data-idx="${i}">
    <img src="${t.url}" alt="">
    <button class="remove-btn" onclick="removeThumb(${i})">✕</button>
    <div class="img-label">${t.alt}</div>
  </div>`;
}

function clientCard(c,i) {
  return `<div class="img-item" data-idx="${i}">
    <img src="${c.url}" alt="" style="object-fit:contain;padding:6px">
    <button class="remove-btn" onclick="removeClient(${i})">✕</button>
  </div>`;
}

function testiCard(t,i) {
  return `<div class="testi-item" data-logo="${esc(t.logo)}">
    <div class="testi-item-head">
      <img src="${t.logo}" alt="">
      <span>Testimonial #${i+1}</span>
      <label style="cursor:pointer;font-size:.78rem;color:var(--muted)">
        📷 Logo<input type="file" accept="image/*" style="display:none" class="testi-logo-upload">
      </label>
      <button onclick="this.closest('.testi-item').remove()">🗑 Remove</button>
    </div>
    <div class="field"><label>Quote</label>
      <textarea class="testi-quote-inp" rows="2">${esc(t.quote)}</textarea>
    </div>
    <div class="field"><label>Client alt text / name</label>
      <input class="testi-alt" value="${esc(t.alt||'')}">
    </div>
    <div class="stars-row" data-stars="${t.stars||5}">
      ${[1,2,3,4,5].map(n => `<span class="star ${n<=(t.stars||5)?'on':''}" data-n="${n}">★</span>`).join('')}
    </div>
  </div>`;
}

function socialRow(s) {
  const platforms = ['instagram','tiktok','facebook','twitter','youtube','linkedin','other'];
  const opts = platforms.map(p => `<option value="${p}" ${p===s.platform?'selected':''}>${p.charAt(0).toUpperCase()+p.slice(1)}</option>`).join('');
  return `<div class="social-item">
    <select class="soc-platform">${opts}</select>
    <input class="soc-label" placeholder="Label" value="${esc(s.label)}">
    <input class="soc-url" placeholder="https://..." value="${esc(s.url)}">
    <button onclick="this.closest('.social-item').remove()">✕</button>
  </div>`;
}

/* ============================================================
   PANEL NAVIGATION
   ============================================================ */
function renderPanel(name) {
  currentPanel = name;
  document.getElementById('contentArea').innerHTML = PANELS[name]();
  document.getElementById('panelTitle').textContent =
    { logo:'Site Logo', hero:'Hero', clients:'Client Logos', work:'My Work', about:'About', testimonials:'Testimonials', contact:'Contact' }[name];

  // Bind dynamic events after render
  bindPanelEvents(name);
}

function bindPanelEvents(name) {
  const ca = document.getElementById('contentArea');

  if (name === 'logo') {
    ca.querySelector('#logoUpload').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const url = await uploadToCloudinary(f);
        if (!data.site) data.site = {};
        data.site.logo = url;
        ca.querySelector('#logoPreview').src = url;
        toast('Logo uploaded! Save to apply.');
      } catch { toast('Upload failed', 'err'); }
    });
  }

  if (name === 'work') {
    ca.querySelector('#workUpload').addEventListener('change', async e => {
      const files = [...e.target.files];
      for (const f of files) {
        try {
          const url = await uploadToCloudinary(f);
          data.thumbnails.push({ url, alt: f.name.replace(/\.[^.]+$/,'') });
          toast(`Uploaded: ${f.name}`);
        } catch { toast('Upload failed: ' + f.name, 'err'); }
      }
      renderPanel('work');
    });
  }

  if (name === 'clients') {
    ca.querySelector('#clientUpload').addEventListener('change', async e => {
      const files = [...e.target.files];
      for (const f of files) {
        try {
          const url = await uploadToCloudinary(f);
          data.clients.push({ url, alt: f.name.replace(/\.[^.]+$/,'') });
          toast(`Uploaded: ${f.name}`);
        } catch { toast('Upload failed: ' + f.name, 'err'); }
      }
      renderPanel('clients');
    });
  }

  if (name === 'about') {
    ca.querySelector('#portraitUpload').addEventListener('change', async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const url = await uploadToCloudinary(f);
        data.about.portrait = url;
        ca.querySelector('#portraitPreview').src = url;
        toast('Portrait updated');
      } catch { toast('Upload failed', 'err'); }
    });
  }

  if (name === 'testimonials') {
    ca.querySelector('#addTestiBtn').addEventListener('click', () => {
      data.testimonials.push({ logo: 'images/client-1.png', alt: 'Client', quote: 'New testimonial quote here.', stars: 5 });
      renderPanel('testimonials');
    });

    // Testi logo uploads (delegated)
    ca.querySelectorAll('.testi-logo-upload').forEach(inp => {
      inp.addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        const card = inp.closest('.testi-item');
        try {
          const url = await uploadToCloudinary(f);
          card.dataset.logo = url;
          card.querySelector('.testi-item-head img').src = url;
          toast('Logo updated');
        } catch { toast('Upload failed', 'err'); }
      });
    });

    // Star rating
    ca.querySelectorAll('.stars-row').forEach(row => {
      row.querySelectorAll('.star').forEach(star => {
        star.addEventListener('click', () => {
          const n = parseInt(star.dataset.n);
          row.dataset.stars = n;
          row.querySelectorAll('.star').forEach(s => s.classList.toggle('on', parseInt(s.dataset.n) <= n));
        });
      });
    });
  }

  if (name === 'contact') {
    ca.querySelector('#addSocialBtn').addEventListener('click', () => {
      const list = ca.querySelector('#socialList');
      const div = document.createElement('div');
      div.innerHTML = socialRow({ platform:'instagram', label:'Instagram', url:'' });
      list.appendChild(div.firstElementChild);
    });
  }
}

/* ── Remove helpers (global scope for inline onclick) ── */
window.removeThumb = function(i) {
  data.thumbnails.splice(i, 1);
  renderPanel('work');
};
window.removeClient = function(i) {
  data.clients.splice(i, 1);
  renderPanel('clients');
};

/* ── Nav clicks ── */
document.querySelectorAll('.nav-item[data-panel]').forEach(btn => {
  btn.addEventListener('click', () => {
    // collect current before switching
    try { collectCurrentPanel(); } catch(_) {}
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderPanel(btn.dataset.panel);
    // close mobile sidebar
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  });
});

/* ── Mobile sidebar ── */
document.getElementById('hamBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('open');
});
document.getElementById('sidebarOverlay').addEventListener('click', () => {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
});

/* ============================================================
   CHANGE PASSWORD
   ============================================================ */
document.getElementById('changePwBtn').addEventListener('click', () => {
  document.getElementById('changePwModal').classList.add('open');
  document.getElementById('cpErr').textContent = '';
  ['cpCurrent','cpNew','cpConfirm'].forEach(id => document.getElementById(id).value = '');
});
document.getElementById('cpCancel').addEventListener('click', () => {
  document.getElementById('changePwModal').classList.remove('open');
});
document.getElementById('cpSave').addEventListener('click', async () => {
  const cur     = document.getElementById('cpCurrent').value;
  const nw      = document.getElementById('cpNew').value;
  const confirm = document.getElementById('cpConfirm').value;
  const err     = document.getElementById('cpErr');

  if (await sha256(cur) !== savedHash()) { err.textContent = 'Current password is wrong.'; return; }
  if (nw.length < 6)                     { err.textContent = 'New password must be at least 6 characters.'; return; }
  if (nw !== confirm)                    { err.textContent = 'Passwords do not match.'; return; }

  const newHash = await sha256(nw);
  localStorage.setItem(CONFIG.PASS_HASH_KEY, newHash);
  document.getElementById('changePwModal').classList.remove('open');
  toast('Password changed successfully!');
});

/* ============================================================
   BOOT
   ============================================================ */
async function initApp() {
  try {
    await loadData();
    renderPanel('hero');
  } catch(e) {
    console.error(e);
  }
}

// Auto-restore session
if (isLoggedIn()) {
  showApp();
  initApp();
} else {
  showLogin();
}
</script>
</body>
</html>
